<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mut:#9aa1b4;--ln:#2b3040}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mut:#9aa1b4;--ln:#2b3040}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif}
header{padding:20px 16px 8px}h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--mut);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;z-index:5}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 10px;font:inherit;font-size:12px;text-align:center;line-height:1.3}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 12px 40px;max-width:640px;margin:auto}
.day{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.day h2{font-size:17px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--ln)}
.t{flex:none;width:92px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:2px}
.b{flex:1;border-left:3px solid var(--see);padding-left:10px}
.row.go .b{border-color:var(--go)}.row.eat .b{border-color:var(--eat)}.row.warn .b{border-color:var(--warn)}.row.rest .b{border-color:var(--ln)}
.n{display:block;font-size:12.5px;color:var(--mut)}.row.warn .n{color:var(--warn)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);padding:0 16px 4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px;font-size:14px}
.box h3{margin:0 0 6px;font-size:15px}.box li{margin:3px 0}
.pg{height:6px;background:var(--ln);border-radius:4px;overflow:hidden;margin:4px 0}.pg div{height:100%;background:var(--see)}
.sg{display:flex;gap:4px;margin-top:6px}.sg button{flex:1;border:1px solid var(--ln);background:none;color:var(--mut);border-radius:8px;padding:4px 2px;font:inherit;font-size:11.5px}
.sg button.on.todo{background:var(--ln);color:var(--tx)}.sg button.on.doing{background:var(--go);color:#fff;border-color:var(--go)}.sg button.on.done{background:var(--see);color:#fff;border-color:var(--see)}
.s-done{opacity:.55}.s-doing .b{background:rgba(37,99,235,.1);border-radius:0 8px 8px 0}
.tg{color:var(--warn);font-size:11.5px}.tg.lt{color:var(--eat)}
#al{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ac);color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 16px #0004}.toast span{flex:1}.toast button{border:0;border-radius:8px;padding:5px 8px;font:inherit;font-size:12px}
#pb{margin-top:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:5px 10px;font:inherit;font-size:12px}
</style></head><body>
<header><h1>🇨🇳 เซินเจิ้น–กว่างโจว แบบคนไม่เคยไป</h1><p>23–29 ต.ค. 2026 · BKK ⇄ SZX · พัก CYBO</p><p>⏰ เตือนก่อนถึงเวลา 10 นาที ตามเวลาจีน (เร็วกว่าไทย 1 ชม.) · ต้องเปิดหน้านี้ค้างไว้</p><button id="pb" onclick="ask()">🔔 เปิดแจ้งเตือนของเครื่อง</button></header>
<div class="lg"><span><i style="background:var(--see)"></i>เที่ยว/เดิน</span><span><i style="background:var(--go)"></i>เดินทาง</span><span><i style="background:var(--eat)"></i>กินข้าว</span><span><i style="background:var(--warn)"></i>ระวัง/ต้องทำ</span></div>
<nav id="nav"></nav><main id="m"></main><div id="al"></div>

["21:00–22:30","นั่งรถไฟกลับ","go"]]},
{k:"26 จ",t:"Window of the World · OCT",s:"เดินเล่นสบายๆ จบที่ One Avenue",r:[

["09:30–11:30","เดินเล่น","see"],

["16:00–17:30","เดินไป Shenzhen Bay Park","see","เส้นทาง 7 จุด: Houhai (exit M) → Talent Park → Liuhuashan Park → Universiade Volunteer Memorial Forest → Talent Star Avenue → Bay Culture Plaza → Bay MixC"],
["17:30–18:00","แท็กซี่ → One Avenue / Zhuoyue Center","go"],
["18:00–20:00","เดินเล่น กินข้าว","eat"],
["20:00–21:00","กลับ","go"]]},

["07:30–09:30","ไป Shenzhen Railway Station","go","จากโรงแรม 30 นาที"],

["20:00 / 21:00 / 22:00","รถไฟ Guangzhoudong → Shenzhen (0:57)","go","เลือกรอบได้ · ออก :00 ถึง :57"]]},
{k:"28 พ",t:"Huaqiangbei · วันสำรอง",s:"หรือเก็บตกที่อื่นๆ ก็ได้",r:[

x:["มือถือมือ 1 → Yuanwang Digital Mall (ข้ามชั้น 1–2 ไปชั้น 3 ขายส่ง)","กล้อง/CCD มือ 2 → Modern Window Building","คอมพ์/มือถือ/Accessory → SEG Building (ห้ามไป) · ไปด้านหลัง Huitong หรือ Pacific Communication Market","ฟิล์มติดจอ/Smart Watch → Longsheng Parts City C, D Block (1 หยวน/ชิ้น)","Accessory เล็กๆ → Longsheng Block A, B (ชั้นบนยิ่งถูก)","คอมพ์/แท็บเล็ตมือ 2 → Tiandi Fei Yang Market (ชั้น 1 อุปกรณ์ · ชั้น 2 อะไหล่ · ชั้น 3 คอมพ์ ถูกกว่าปลา)","Apple มือ 2 → Tong Tian Di / Feiyang Times Building","Android มือ 2 → Changcheng Building","Electronic Components → Huaqiang Electronics World"]},
{k:"29 พฤ",t:"เดินทางกลับ",s:"SZX → BKK",r:[
["08:00–10:00","Shopping ตลาด","eat"],
["12:00","เช็คเอาท์ · นัดรถไปสนามบิน","warn"],
["12:00–13:00","เดินทางไปสนามบิน","go"],
["13:00","Check-in ที่สนามบิน","go"],
["15:55","บิน CZ8323 SZX T3 → BKK T1","go","เวลาใหม่ 15:55 (เดิม 16:10) · ถึง 18:15"],
["18:30–20:30","เดินทางถึงรังสิต","go","ต้องเอาเสื้อทำงานไปด้วย"],
["ทิป","เรียก RoboTaxi ด้วย Pony.ai","warn","ใน Mini Program ของ WeChat"]]}
];
const nav=document.getElementById('nav'),m=document.getElementById('m');
let cur=0;function show(i,keep){[...nav.children].forEach((b,j)=>b.classList.toggle('on',i===j||(i===-1&&j===D.length)));
cur=i;m.innerHTML=(i===-1?tips():day(D[i],i));if(!keep)scrollTo(0,0)}
function day(d,di){const n=d.r.filter((r,ri)=>st(di,ri)==='done').length;return `<div class="day"><h2>${d.k} · ${d.t}</h2><div class="sub">${d.s}</div><div class="pg"><div style="width:${n/d.r.length*100}%"></div></div><div class="sub">เสร็จแล้ว ${n}/${d.r.length}</div>`+d.r.map((r,ri)=>{const s=st(di,ri),w=win(di,r);return `<div class="row ${r[2]} s-${s}"><div class="t">${r[0]}${w==='now'&&s==='todo'?'<br><b class="tg">⏰ ถึงเวลา</b>':''}${w==='late'&&s==='todo'?'<br><b class="tg lt">เลยเวลา</b>':''}</div><div class="b">${r[1]}${r[3]?`<span class="n">${r[3]}</span>`:''}<div class="sg">${SL.map(([k,l])=>`<button class="${s===k?'on '+k:''}" onclick="setSt(${di},${ri},'${k}')">${l}</button>`).join('')}</div></div></div>`}).join('')+`</div>`+(d.x?`<div class="box"><h3>🛒 ซื้ออะไร ไปตึกไหน</h3><ul>${d.x.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'')}
function tips(){return `<div class="box"><h3>🚆 รถไฟ Guangzhou ⇄ Shenzhen</h3><ul><li>ความเร็วสูง: Guangzhou South → Shenzhen North/Futian ใช้ 29–45 นาที (21:03–21:44, 21:40–22:46)</li><li>รถไฟด่วน: Guangzhou East → Shenzhen ใช้ 1 ชม.–1 ชม. 40 นาที (21:00–21:57)</li></ul></div>
<div class="box"><h3>🧭 ชื่อสถานี</h3><ul><li>North = Bei (เป่ย)</li><li>South = Nan (น่าน)</li><li>East = Dong (ตง)</li><li>West = Xi (ซี)</li></ul></div>
<div class="box"><h3>🗣 ประโยคจำเป็น</h3><ul><li>ห้องน้ำไปทางไหน → สี่โส่วเจียน จ้ายหนาหลี่</li><li>ขอบคุณ → เซียะเซียะ</li><li>0288 → หลิง เอ้อร์ ปา ปา</li></ul></div>`}
D.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=d.k.replace(' ','<br>');b.onclick=()=>show(i);nav.appendChild(b)});
const b=document.createElement('button');b.innerHTML='ทิป<br>ศัพท์';b.onclick=()=>show(-1);nav.appendChild(b);
const SL=[['todo','ยังไม่ทำ'],['doing','กำลังทำ'],['done','เสร็จแล้ว']];
let S={},N={};try{S=JSON.parse(localStorage.getItem('szS')||'{}');N=JSON.parse(localStorage.getItem('szN')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('szS',JSON.stringify(S));localStorage.setItem('szN',JSON.stringify(N))}catch(e){}};
function st(di,ri){return S[di+'-'+ri]||'todo'}
function setSt(di,ri,k){S[di+'-'+ri]=k;sv();show(di,true)}
function win(di,r){const t=/^(\d{1,2}):(\d{2})/.exec(r[0]);if(!t)return '';const d=Date.now()-Date.UTC(2026,9,23+di,+t[1]-8,+t[2]);return d>=-600000&&d<=1800000?'now':d>1800000?'late':''}
function toast(di,ri,r){const e=document.createElement('div');e.className='toast';e.innerHTML=`<span>⏰ ${r[0].split('–')[0]} · ${r[1]}</span><button>เริ่มทำ</button><button>ปิด</button>`;const b=e.querySelectorAll('button');b[0].onclick=()=>{setSt(di,ri,'doing');e.remove()};b[1].onclick=()=>e.remove();document.getElementById('al').appendChild(e);try{navigator.vibrate&&navigator.vibrate(200)}catch(x){}try{if(Notification.permission==='granted')new Notification('ถึงเวลาแล้ว',{body:r[0]+' '+r[1]})}catch(x){}}
function ask(){const p=document.getElementById('pb');try{Notification.requestPermission().then(v=>{p.textContent=v==='granted'?'🔔 เปิดแล้ว':'🔕 ไม่ได้รับอนุญาต (ใช้แถบเตือนในหน้าแทน)'})}catch(e){p.textContent='🔕 เครื่องนี้ไม่รองรับ (ใช้แถบเตือนในหน้าแทน)'}}
function chk(){D.forEach((d,di)=>d.r.forEach((r,ri)=>{const k=di+'-'+ri;if(st(di,ri)==='todo'&&win(di,r)==='now'&&!N[k]){N[k]=1;toast(di,ri,r)}}));sv();show(cur,true)}
const cn=new Date(Date.now()+288e5);const i0=cn.getUTCMonth()===9&&cn.getUTCDate()>=23&&cn.getUTCDate()<=29?cn.getUTCDate()-23:0;
show(i0);chk();setInterval(chk,30000);
</script></body></html>
